[project]
name = "diskos-installer"
version = "1.2.2"   # keep equal to diskos_installer.__version__ (tests/test_project.py checks)
description = "Builds and flashes diskOS for the FiiO Snowsky Disc from the user's own stock firmware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Exact pins: the license texts in licenses/ are for these versions (tests/test_project.py checks the
# lock against them). Upgrading one means updating its license file too.
dependencies = [
    "pyusb==1.3.1",          # mask-ROM USB device detection (BSD-3-Clause)
    "pycryptodome==3.23.0",  # AES-decrypt of FiiO OTA chunks (BSD-2-Clause + public-domain)
    "certifi==2026.2.25",    # pinned CA bundle for the firmware download (MPL-2.0)
    "platformdirs==4.2.2",   # per-user cache locations (MIT)
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    # Exact: a new ruff or ty release can change formatting or diagnostics. Bump deliberately, with the
    # matching rev in .pre-commit-config.yaml.
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.uv]
package = false

# ---- ruff: linter + formatter ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".dev",
    "corresponding-source",
    "licenses",
    "spl-src",
    "src/usbboot",
    "ui/lvgl",
    "ui/third_party",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: undefined names, unused imports and variables
    "I",        # import sorting
    "B",        # bugbear: mutable defaults, loop-variable closures, except mistakes
    "UP",       # pyupgrade, as far as target-version allows
    "SIM",      # simpler conditionals
    "C4",       # comprehensions
    "RET",      # returns
    "PL",       # pylint, incl. size limits (see [tool.ruff.lint.pylint])
    "S",        # bandit security: this tool downloads firmware and runs subprocesses
    "PTH",      # pathlib over os.path
    "RUF",      # ruff's own checks
    "ERA",      # commented-out code
    "TID",      # banned imports
]
ignore = [
    "T20",   # print is this CLI's output (not selected; listed for the record)
    "D",     # docstrings: per module, later
    "ANN",   # annotations: per module, later, together with ty strictness
    "COM",   # trailing commas: the formatter's job
]

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",      # assert
    "S108",      # fixed /tmp paths in fixtures
    "PLR2004",   # magic values in expectations
]

