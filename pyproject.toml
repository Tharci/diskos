# ---- ty: type checker ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.10"
python-platform = "all"   # the installer runs on Linux, macOS and Windows (ctypes.windll, winreg, ...)
extra-paths = ["build", "tests", "ui/tests"]   # modules the tests import via sys.path

[tool.ty.src]
exclude = [   # the same vendored trees ruff skips
    ".dev",
    "corresponding-source",
    "licenses",
    "spl-src",
    "src/usbboot",
    "ui/lvgl",
    "ui/third_party",
]

