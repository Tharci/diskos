rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["ui/tools/gen_beam_glyph.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["ui/tools/gen_theme_fonts.py"]
rules = { unresolved-import = "ignore" }

# ---- pytest -------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]   # the package, and the tests' shared helpers (unittest discover did both)
addopts = "-ra --strict-markers --strict-config"
